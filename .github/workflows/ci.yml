name: CI

on:
  push:
    branches: [main, 'improve/**', 'feature/**', 'fix/**', 'codex/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser and PDF regression tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
